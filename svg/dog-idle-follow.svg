<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -10 50 50" width="500" height="500" shape-rendering="crispEdges">
  <defs>
    <style>
      :root {
        --cat-color: #E2974A;
        --cat-outline: #000000;
        --cat-outline-width: 1;
        --purr-face-x: 0px;
        --purr-face-y: 0px;
        --collar-color: #E53935;
        --collar-tag: #FDD835;
      }

      .breathe-anim { transform-origin: 16px 22px; animation: none; }
      .tail-sway { transform-origin: 24px 28px; animation: dog-tail-wag 1.2s infinite ease-in-out; }
      .ear-twitch-l { transform-origin: 6px 6px; animation: dog-ear-l 4s infinite ease-in-out; }
      .ear-twitch-r { transform-origin: 22px 6px; animation: dog-ear-r 4s infinite ease-in-out; }

      .eye-l-blink {
        transform-origin: 9px 12.5px;
        animation: none;
      }
      .eye-r-blink {
        transform-origin: 18px 12.5px;
        animation: none;
      }
      :root.idle-animated .breathe-anim { animation: breathe 3.5s infinite ease-in-out; }
      :root.idle-animated .eye-l-blink,
      :root.idle-animated .eye-r-blink {
        animation: blink 3.5s infinite;
      }
      .pupil-left, .pupil-right {
        transform-box: fill-box;
        transform-origin: center;
        transition: transform 0.22s ease-out;
      }

      @keyframes dog-tail-wag {
        0%, 100% { transform: rotate(-8deg); }
        50% { transform: rotate(18deg); }
      }
      @keyframes dog-ear-l {
        0%, 90%, 100% { transform: rotate(0deg); }
        93% { transform: rotate(-6deg); }
        96% { transform: rotate(3deg); }
      }
      @keyframes dog-ear-r {
        0%, 90%, 100% { transform: rotate(0deg); }
        93% { transform: rotate(6deg); }
        96% { transform: rotate(-3deg); }
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.3px); }
      }
      @keyframes blink {
        0%, 96%, 100% { transform: scaleY(1); }
        98% { transform: scaleY(0.1); }
      }
      @keyframes purr-happy-eyes {
        0% { transform: scaleY(1); }
        100% { transform: scaleY(0.2); }
      }
      :root.purring .eye-l-blink,
      :root.purring .eye-r-blink {
        animation: purr-happy-eyes 0.2s ease-out forwards;
      }
      :root.purring #dog-tongue {
        opacity: 1 !important;
        animation: pant-tongue 0.4s steps(2) infinite;
      }
      @keyframes pant-tongue {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(1px); }
      }

      #body-js, #face-js, #eyes-js {
        transition: transform 0.18s ease-out;
      }
    </style>

    <filter id="cat-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="dilated"/>
      <feFlood flood-color="var(--cat-outline)" result="flood"/>
      <feComposite in="flood" in2="dilated" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="dog-head-clip">
      <path transform="translate(3 4)" d="M4 3H2V5H1V7H0V12H1V16H3V17H4V18H6V19H16V18H18V17H19V16H20V15H21V12H22V8H21V5H20V4H19V3H17V2H15V1H7V2H4V3Z"/>
    </clipPath>
    <clipPath id="dog-body-clip">
      <path transform="translate(3 19)" d="M15 0V1H18V2H20V3H21V6H22V11H21V14H19V15H3V14H1V11H0V6H1V3H2V2H4V1H7V0H15Z"/>
    </clipPath>
  </defs>

  <g id="body-js" filter="url(#cat-outline)">
    <g class="breathe-anim">
      <!-- Tail: Wagging happy dog tail -->
      <g class="tail-sway">
        <g id="tail" fill="var(--cat-color)">
          <path d="M23 27V25H24V23H25V21H27V19H29V18H31V19H32V21H31V23H29V25H27V27H25V29H23V27Z"/>
          <!-- White tip for shiba/corgi tail -->
          <rect x="29" y="18" width="3" height="3" fill="#FFFFFF"/>
        </g>
      </g>

      <!-- Dog Body -->
      <g id="body" fill="var(--cat-color)">
        <path transform="translate(3 19)" d="M15 0V1H18V2H20V3H21V6H22V11H21V14H19V15H3V14H1V11H0V6H1V3H2V2H4V1H7V0H15Z"/>
        <!-- White belly bib -->
        <path d="M10 20H18V28H17V32H11V28H10V20Z" fill="#FFF8F0"/>
        <g class="patches" clip-path="url(#dog-body-clip)"></g>
      </g>

      <!-- Front Paws -->
      <g id="legs" fill="var(--cat-color)">
        <g id="leg-fl">
          <path d="M6 29V26H7V25H10V26H11V28H12V31H13V32H14V35H13V36H9V35H8V31H7V29H6Z"/>
          <!-- White paw tip -->
          <rect x="8" y="33" width="5" height="3" fill="#FFF8F0"/>
        </g>
        <g id="leg-fr">
          <path d="M23 29V26H22V25H19V26H18V28H17V31H16V32H15V35H16V36H20V35H21V31H22V29H23Z"/>
          <!-- White paw tip -->
          <rect x="16" y="33" width="5" height="3" fill="#FFF8F0"/>
        </g>
      </g>

      <!-- Dog Collar with Golden Bell/Tag -->
      <g id="dog-collar">
        <rect x="6" y="19" width="16" height="2" fill="var(--collar-color)"/>
        <rect x="13" y="21" width="2" height="2" fill="var(--collar-tag)"/>
      </g>

      <!-- ===== DOG FACE GROUP ===== -->
      <g id="face-js">
        <!-- Dog Ears (Floppy / Perky Shiba Style) -->
        <g class="ear-twitch-l">
          <g id="ear-left" fill="var(--cat-color)">
            <path d="M3 2H7V4H8V7H7V9H6V11H4V11H3V9H2V6H3V2Z"/>
            <!-- Inner ear pink/cream -->
            <path d="M4 4H6V7H5V9H4V4Z" fill="#F8BBD0"/>
          </g>
        </g>
        <g class="ear-twitch-r">
          <g id="ear-right" fill="var(--cat-color)">
            <path d="M19 2H23V6H24V9H23V11H21V11H20V9H19V7H20V4H19V2Z"/>
            <!-- Inner ear pink/cream -->
            <path d="M20 4H22V9H21V7H20V4Z" fill="#F8BBD0"/>
          </g>
        </g>

        <!-- Head Base -->
        <g id="head" fill="var(--cat-color)">
          <path transform="translate(3 4)" d="M4 3H2V5H1V7H0V12H1V16H3V17H4V18H6V19H16V18H18V17H19V16H20V15H21V12H22V8H21V5H20V4H19V3H17V2H15V1H7V2H4V3Z"/>
          <!-- Shiba White Eyebrow Spots (Tan dots above eyes) -->
          <rect x="7" y="7" width="2" height="2" fill="#FFF8F0"/>
          <rect x="17" y="7" width="2" height="2" fill="#FFF8F0"/>
        </g>

        <!-- Dog Muzzle / Snout (Cream White with Dark Nose) -->
        <g id="dog-snout">
          <!-- White muzzle patch -->
          <path d="M9 13H19V18H17V19H11V18H9V13Z" fill="#FFF8F0"/>
          <!-- Black Nose -->
          <rect x="13" y="12" width="2" height="2" fill="#1A1A1A"/>
          <!-- Nose Bridge & Mouth -->
          <rect x="13" y="14" width="2" height="1" fill="#1A1A1A"/>
          <path d="M11 16H13V15H15V16H17V17H16V16H12V17H11V16Z" fill="#1A1A1A"/>
        </g>

        <!-- Tongue (Appears when panting/purring) -->
        <g id="dog-tongue" opacity="0">
          <rect x="13" y="17" width="2" height="3" fill="#FF5252"/>
        </g>

        <!-- Eyes -->
        <g id="eyes-js">
          <!-- Left Eye -->
          <g id="eye-left" class="eye-l-blink">
            <rect x="7" y="10" width="4" height="4" fill="var(--eye-bg-color, #FFFFFF)"/>
            <rect class="pupil-left" id="pupil-left" x="8" y="11" width="2" height="2" fill="var(--eye-color-left, #2A1A08)"/>
            <!-- Sparkle highlight -->
            <rect x="8" y="11" width="1" height="1" fill="#FFFFFF"/>
          </g>

          <!-- Right Eye -->
          <g id="eye-right" class="eye-r-blink">
            <rect x="17" y="10" width="4" height="4" fill="var(--eye-bg-color, #FFFFFF)"/>
            <rect class="pupil-right" id="pupil-right" x="18" y="11" width="2" height="2" fill="var(--eye-color-right, #2A1A08)"/>
            <!-- Sparkle highlight -->
            <rect x="18" y="11" width="1" height="1" fill="#FFFFFF"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
